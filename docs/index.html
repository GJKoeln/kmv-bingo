<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>KMV-Bingo - GJK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>

<main class="app-shell">
    <!-- Header -->
    <header class="hero">
        <div class="hero-content">
            <span id="bingo-subtitle" class="eyebrow">19.09.2026</span>
            <h1 id="bingo-title">KMV-Bingo</h1>
        </div>
        <img src="assets/logo.png" alt="Grüne Jugend Köln" class="hero-logo">
    </header>

    <!-- Controls -->
    <section class="card controls-card">
        <button id="regenerateBtn" class="button button--primary">Neues Board</button>
    </section>

    <!-- Victory Banner -->
    <div id="bingoBanner" class="bingo-message">
        🎉 BINGO! Du hast <span id="winCountMessage">0</span> Gewinnlinie(n) gebildet!
    </div>

    <!-- 5x5 Grid -->
    <section class="card board-card">
        <div id="bingoBoard" class="board"></div>
    </section>

    <!-- Footer Explanation -->
    <footer class="footer">
        <span>5x5 Zufalls-Layout</span>
        <span>Tippe auf Kacheln, um sie zu markieren</span>
    </footer>
</main>

<!-- External JS Dependencies -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
